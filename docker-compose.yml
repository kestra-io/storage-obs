services:
  minio:
    # MinIO no longer publishes images to Docker Hub / quay.io; Chainguard's build is still pullable anonymously.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
